<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Connection</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #242424;
            color: #ffffff;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px;
            background: #2f2f2f;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
        }
        p {
            color: #b0b0b0;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        button {
            background-color: #0b5cff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #094acc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>No Connection</h1>
        <p>Zoom Linux Native could not connect to the internet. Please check your network connection and try again.</p>
        <button id="retry-btn">Try Again</button>
    </div>
    <script>
        document.getElementById('retry-btn').addEventListener('click', () => {
            if (window.electronAPI && window.electronAPI.reloadApp) {
                window.electronAPI.reloadApp();
            } else {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
