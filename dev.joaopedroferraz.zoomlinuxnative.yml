app-id: dev.joaopedroferraz.zoomlinuxnative
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: zoom-linux-native
separate-locales: false
finish-args:
  # Screen sharing & media
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.portal.Desktop
  # Network
  - --share=network
  # GPU acceleration
  - --device=dri
modules:
  - name: zoom-linux-native
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node18/bin
    build-commands:
      # NPM configuration for offline build (standard for Flatpak)
      - npm ci --offline
      - npm run build:linux -- --dir
      # Copy files to prefix
      - cp -r dist/linux-unpacked /app/lib/zoom-linux-native
      - install -Dm755 flatpak/zoom-linux-native.sh /app/bin/zoom-linux-native
      # Icons and Desktop file
      - install -Dm644 build/icon.png /app/share/icons/hicolor/512x512/apps/dev.joaopedroferraz.zoomlinuxnative.png
      - install -Dm644 flatpak/dev.joaopedroferraz.zoomlinuxnative.desktop /app/share/applications/dev.joaopedroferraz.zoomlinuxnative.desktop
    sources:
      - type: dir
        path: .
      # Flatpak requires offline npm dependencies which usually needs flatpak-node-generator
      # This is a placeholder for where the generated generated-sources.json would go
      # - type: file
      #   path: generated-sources.json
