app-id: dev.joaopedroferraz.zoomlinuxnative
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: zoom-linux-native.sh
separate-locales: false

finish-args:
  # Wayland + X11 fallback
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Audio (camera/mic + system audio)
  - --socket=pulseaudio
  # Network access (required — Zoom is a web service)
  - --share=network
  # GPU acceleration for video rendering
  - --device=dri
  # Portal access for screen sharing (xdg-desktop-portal)
  - --talk-name=org.freedesktop.portal.Desktop
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # System tray (KDE/GNOME StatusNotifier)
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: zoom-linux-native
    buildsystem: simple
    build-commands:
      # Install the shell wrapper as the app entrypoint
      - install -Dm755 flatpak/zoom-linux-native.sh /app/bin/zoom-linux-native.sh
      # Copy pre-built Electron app to the Flatpak prefix
      - mkdir -p /app/lib/zoom-linux-native
      - cp -a dist/linux-unpacked/* /app/lib/zoom-linux-native/
      # Desktop entry
      - install -Dm644 flatpak/dev.joaopedroferraz.zoomlinuxnative.desktop /app/share/applications/dev.joaopedroferraz.zoomlinuxnative.desktop
      # App icon (512x512)
      - install -Dm644 build/icon.png /app/share/icons/hicolor/512x512/apps/dev.joaopedroferraz.zoomlinuxnative.png
      # AppStream metainfo
      - install -Dm644 flatpak/dev.joaopedroferraz.zoomlinuxnative.metainfo.xml /app/share/metainfo/dev.joaopedroferraz.zoomlinuxnative.metainfo.xml
    sources:
      - type: dir
        path: ..
